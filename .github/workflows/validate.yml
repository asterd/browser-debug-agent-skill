name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium (for headless CDP)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: Install dependencies
        working-directory: core
        run: npm ci || npm install
      - name: Build
        working-directory: core
        run: npm run build
      - name: Unit tests
        working-directory: core
        run: node --test --test-timeout=60000 "dist/*.test.js"
      - name: E2E test (verify)
        working-directory: core
        run: sh test-e2e.sh
      - name: E2E test (repair loop)
        working-directory: core
        run: sh test-e2e-repair.sh
