<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome DevTools live repair demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 42rem; }
      button { font: inherit; padding: .6rem .85rem; }
      #status { color: #8a4200; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Chrome DevTools live repair demo</h1>
      <p id="status" role="status">Ready</p>
      <button id="publish" type="button">Publish</button>
    </main>
    <script>
      const button = document.querySelector('#publish');
      const status = document.querySelector('#status');

      button.addEventListener('click', () => {
        status.textContent = 'Publishing…';

        status.textContent = 'Published';
      });

      window.__BDA_CHROME_DEMO__ = () => ({
        expectedStatus: 'Published',
        actualStatus: status.textContent
      });
    </script>
  </body>
</html>
